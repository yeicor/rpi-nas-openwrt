# Lighttpd configuration for OpenWrt Headless NAS
# Serves root of the USB storage drive (/mnt/sda1) at :8080 (HTTP) and :8443 (HTTPS)
# Uses non-default ports to avoid conflicting with OpenWrt's internal uhttpd web server

# Standard OpenWrt Lighttpd variables (required by conf.d/*.conf modules)
var.log_root    = "/var/log/lighttpd"
var.server_root = "/mnt/sda1"
var.state_dir   = "/var/run"
var.home_dir    = "/var/lib/lighttpd"
var.conf_dir    = "/etc/lighttpd"
var.vhosts_dir  = server_root + "/vhosts"
var.cache_dir   = "/var/cache/lighttpd"
var.socket_dir  = home_dir + "/sockets"

server.modules = (
    "mod_access",
    "mod_alias",
    "mod_auth",
    "mod_authn_pam",
    "mod_webdav",
    "mod_dirlisting",
    "mod_openssl"
)

# Enable interactive web directory browser for GET requests
dir-listing.activate = "enable"

server.document-root = "/mnt/sda1"
server.upload-dirs   = ( "/tmp" )
server.errorlog      = "/var/log/lighttpd/error.log"
server.pid-file      = "/var/run/lighttpd.pid"

# Run as www-data so WebDAV operations inherit non-root www-data ownership
server.username      = "www-data"
server.groupname     = "www-data"

# Non-default HTTP port (avoids uhttpd port 80 conflict)
server.port          = 8080

# MIME type mapping
mimetype.assign = (
    ".html" => "text/html",
    ".txt"  => "text/plain",
    ".jpg"  => "image/jpeg",
    ".png"  => "image/png",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ""      => "application/octet-stream"
)

index-file.names = ( "index.html", "index.htm" )

# Non-default SSL configuration on port 8443 (avoids uhttpd port 443 conflict)
$SERVER["socket"] == ":8443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/ssl/server.pem"
    ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2")
}

# Include additional configurations
include "conf.d/*.conf"
