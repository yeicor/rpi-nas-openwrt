# WebDAV module configuration for OpenWrt Headless NAS
# Serves the root of the USB storage drive (/mnt/sda1) with PAM user authentication

auth.backend = "pam"
auth.backend.pam.opts = ( "service" => "lighttpd" )

auth.require = ( "" => (
    "method" => "basic",
    "realm" => "OpenWrt Headless NAS WebDAV",
    "require" => "valid-user"
) )

webdav.activate = "enable"
webdav.is-readonly = "disable"

# Locks stored in tmpfs (RAM) to avoid SD card wear
webdav.sqlite-db-name = "/tmp/webdav_locks.db"
